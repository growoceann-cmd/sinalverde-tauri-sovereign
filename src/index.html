<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINALVERDE.IA | SOVEREIGN COMMAND v8.5 (Tauri Optimized)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --pqc-green: #00ff8c; 
            --pqc-cyan: #00ffff;
            --sr-danger: #ff2a2a; 
            --matrix-gold: #ffd700; 
            --glass-bg: rgba(0, 5, 5, 0.88);
            --border-color: rgba(0, 255, 140, 0.2);
        }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'JetBrains Mono', monospace; color: #fff; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .glass-panel { background: var(--glass-bg); border: 1px solid var(--border-color); pointer-events: auto; backdrop-filter: blur(25px); position: absolute; z-index: 20; }
        .tesla-font { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 2px; }

        .header-box { top: 20px; left: 20px; padding: 15px 25px; border-left: 5px solid var(--pqc-green); }
        .controls-box { top: 20px; right: 125px; padding: 12px 20px; }
        .accuracy-box { top: 20px; right: 20px; width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--pqc-cyan); display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); }
        .log-box { bottom: 20px; left: 20px; width: 340px; padding: 18px; }
        .metrics-box { bottom: 20px; left: 380px; right: 20px; padding: 15px 40px; display: flex; justify-content: space-around; align-items: center; height: 120px; }

        .text-header { font-size: 1.3rem; font-weight: 900; }
        .text-tiny { font-size: 9px; text-transform: uppercase; color: #666; font-weight: bold; letter-spacing: 1.5px; }
        .text-val { font-size: 1.6rem; font-weight: 900; }

        #live-hud { position: fixed; right: 20px; top: 130px; width: 320px; transform: translateX(450px); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 30; }
        #live-hud.active { transform: translateX(0); }
        
        .scan-line { height: 1px; width: 100%; background: var(--pqc-green); position: absolute; top: 0; animation: scan 3s infinite linear; opacity: 0.3; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .btn-matrix { border: 1px solid var(--pqc-green); color: var(--pqc-green); font-size: 9px; padding: 6px 14px; transition: 0.3s; margin-left: 8px; font-weight: bold; }
        .btn-matrix:hover, .btn-matrix.active { background: var(--pqc-green); color: #000; box-shadow: 0 0 15px var(--pqc-green); }

        .heartbeat { color: var(--sr-danger); animation: pulse 1s infinite; font-size: 12px; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.4; } }
        
        .log-content { height: 85px; overflow: hidden; font-size: 9px; color: #555; margin-top: 10px; line-height: 1.5; }
        .witness-footer { font-size: 8px; color: var(--pqc-green); border-top: 1px solid #111; padding-top: 8px; margin-top: 12px; display: flex; justify-content: space-between; font-weight: bold; }
        
        .area-label { background: rgba(0, 255, 255, 0.1); border: 1px solid var(--pqc-cyan); padding: 4px 12px; font-size: 10px; color: var(--pqc-cyan); font-weight: 900; }
        .neural-bar { width: 4px; background: var(--pqc-green); margin-right: 2px; transition: height 0.1s; border-radius: 1px; }

        /* Estilo para as novas variáveis */
        .sensor-tag { font-size: 10px; color: var(--pqc-green); border: 1px solid rgba(0, 255, 140, 0.1); padding: 2px 8px; border-radius: 4px; background: rgba(0, 255, 140, 0.05); }
    </style>
</head>
<body>
    <div id="qr-login" class="fixed inset-0 z-[100] bg-black flex flex-col justify-center items-center tesla-font">
        <div class="glass-panel p-12 flex flex-col items-center gap-8 border-2 border-[#00ff8c] shadow-[0_0_50px_rgba(0,255,140,0.2)]">
            <h1 class="text-3xl font-black text-[#00ff8c] tracking-[0.3em]">HANDSHAKE PQC</h1>
            <div class="w-64 h-64 bg-white p-4 rounded-xl shadow-[0_0_30px_#fff]">
                <!-- QR Code Placeholder -->
                <img id="qr-img" src="" alt="QR Auth" class="w-full h-full opacity-0 transition-opacity duration-500">
            </div>
            <div class="text-center space-y-4">
                <p id="auth-status-text" class="text-xs text-gray-500 font-bold uppercase tracking-widest">Iniciando aperto de mão PQC...</p>
                <div class="flex items-center gap-4 justify-center">
                    <div id="auth-status-dot" class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></div>
                    <span id="auth-status-label" class="text-[10px] text-yellow-500 uppercase">Aguardando Conexão...</span>
                </div>
            </div>
            <button onclick="unlockDashboard()" class="btn-matrix !text-xs !py-3 !px-8 mt-4">PULAR (BYPASS DEV)</button>
        </div>
        <div id="session-display" class="absolute bottom-10 text-[8px] text-gray-700 font-black uppercase tracking-[0.5em]">LETHUS SOVEREIGN SYSTEMS | SESSION: AGUARDANDO...</div>
    </div>

    <script>
        let sessionID = null;
        const API_URL = 'https://sinalverde-api.up.railway.app'; // URL provisória

        async function startHandshake() {
            try {
                const res = await fetch(`${API_URL}/session/create`, { method: 'POST' });
                const data = await res.json();
                sessionID = data.session_id;
                
                const qrImg = document.getElementById('qr-img');
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${sessionID}`;
                qrImg.classList.remove('opacity-0');
                
                document.getElementById('session-display').innerText = `LETHUS SOVEREIGN SYSTEMS | SESSION: ${sessionID.substring(0,8)}...`;
                document.getElementById('auth-status-text').innerText = 'Escaneie com seu Mobile Sovereign';
                
                pollStatus();
            } catch (e) {
                console.error("Erro no handshake:", e);
                document.getElementById('auth-status-label').innerText = 'ERRO DE CONEXÃO CLOUD';
                document.getElementById('auth-status-dot').style.backgroundColor = '#ff2a2a';
            }
        }

        async function pollStatus() {
            if (!sessionID) return;
            try {
                const res = await fetch(`${API_URL}/session/status/${sessionID}`);
                const data = await res.json();
                
                if (data.status === 'authenticated') {
                    document.getElementById('auth-status-label').innerText = 'AUTENTICADO';
                    document.getElementById('auth-status-dot').style.backgroundColor = '#00ff8c';
                    setTimeout(unlockDashboard, 1000);
                } else {
                    setTimeout(pollStatus, 2000);
                }
            } catch (e) {
                setTimeout(pollStatus, 5000);
            }
        }

        // Chamar ao carregar
        startHandshake();

        let scene, camera, renderer, controls, raycaster, mouse;
        let targets = [], dome, particles;
        const clock = new THREE.Clock();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 4000);
            camera.position.set(240, 200, 240);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2.2;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // 1. Grid
            const grid = new THREE.GridHelper(800, 80, 0x00ff8c, 0x000803);
            grid.material.opacity = 0.06;
            grid.material.transparent = true;
            scene.add(grid);

            // 2. THE DOME
            const domeGeo = new THREE.SphereGeometry(350, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2);
            dome = new THREE.Mesh(domeGeo, new THREE.MeshBasicMaterial({ 
                color: 0x00ff8c, wireframe: true, transparent: true, opacity: 0.025, side: THREE.BackSide 
            }));
            scene.add(dome);

            // 3. Triangulation Nodes
            const p1 = new THREE.Vector3(0, 0, 50);
            const p2 = new THREE.Vector3(43.3, 0, -25);
            const p3 = new THREE.Vector3(-43.3, 0, -25);
            
            spawnNode(p1, 0x00ff8c, "PONTO 1");
            spawnNode(p2, 0x00ffff, "PONTO 2");
            spawnNode(p3, 0xffd700, "PONTO 3");

            const tGeo = new THREE.BufferGeometry().setFromPoints([p1, p2, p3, p1]);
            const tLine = new THREE.Line(tGeo, new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4, linewidth: 2 }));
            tLine.position.y = 0.5;
            scene.add(tLine);

            // 4. Point Cloud Aether
            const pCount = 50000;
            const pPos = new Float32Array(pCount * 3);
            for(let i=0; i<pCount; i++) {
                pPos[i*3] = (Math.random() - 0.5) * 800;
                pPos[i*3+1] = Math.pow(Math.random(), 6) * 80;
                pPos[i*3+2] = (Math.random() - 0.5) * 800;
            }
            const pGeo = new THREE.BufferGeometry();
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.4, color: 0x00ff8c, transparent: true, opacity: 0.25 }));
            scene.add(particles);

            // 5. Entities (Animal & Human Silhouettes)
            spawnEntity(12, 0, 15, 0x00ff8c, "Animal (Onça)", "ID-SV-ANIM-132", "132 kg", "0.15", "Predador alfa mapeado via CSI. Movimentação tática.", 65, 24.5, "-19.9221", "-43.9451");
            spawnEntity(-20, 0, 5, 0x00ff8c, "Animal (Capivara)", "ID-SV-ANIM-78", "78 kg", "0.12", "Grupo detectado. Assinatura metabólica em repouso.", 72, 26.2, "-19.9235", "-43.9460");
            spawnEntity(70, 0, 70, 0x00ffff, "Humano (Mestre)", "ID-SV-HUM-001", "82 kg", "0.88", "Assinatura bipedal autorizada detectada na zona externa.", 45, 23.1, "-19.9210", "-43.9440");

            // Neural Wave Setup
            const wave = document.getElementById('neural-wave');
            for(let i=0; i<50; i++) {
                const b = document.createElement('div');
                b.className = 'neural-bar';
                b.style.height = '10%';
                wave.appendChild(b);
            }

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onResize);

            animate();
            runLogs();
        }

        function spawnNode(pos, color, id) {
            const group = new THREE.Group();
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 10, 6), new THREE.MeshBasicMaterial({ color: color, wireframe: true }));
            group.add(mesh);
            const aura = new THREE.Mesh(new THREE.SphereGeometry(12, 16, 16), new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.05 }));
            group.add(aura);
            group.position.copy(pos).y = 5;
            group.userData = { id: id, sp: "MESH NODE ESP32-S3", mass: "HARDWARE ACTIVE", stress: "HEALTH: 100%", log: "Unidade de processamento tático LoRa operacional.", hum: "N/A", temp: "32°C", lat: "-19.9221", lon: "-43.9451" };
            scene.add(group);
            targets.push(group);
        }

        function spawnEntity(x, y, z, color, type, id, mass, stress, log, hum, temp, lat, lon) {
            const group = new THREE.Group();
            const count = 500;
            const pPos = new Float32Array(count * 3);
            const isHuman = type.includes("Humano");
            
            for(let i=0; i<count; i++) {
                if(isHuman) {
                    let py = Math.random() * 8;
                    let px = (Math.random() - 0.5) * (py > 6 ? 1.5 : 2.5);
                    let pz = (Math.random() - 0.5) * 1.5;
                    pPos[i*3] = px; pPos[i*3+1] = py; pPos[i*3+2] = pz;
                } else {
                    let pz = (Math.random() - 0.5) * 10;
                    let py = Math.random() * 4;
                    let px = (Math.random() - 0.5) * 5;
                    pPos[i*3] = px; pPos[i*3+1] = py; pPos[i*3+2] = pz;
                }
            }
            const pGeo = new THREE.BufferGeometry();
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const points = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.5, color: color, transparent: true, opacity: 0.9 }));
            group.add(points);
            
            const aura = new THREE.Mesh(new THREE.SphereGeometry(15, 16, 16), new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.04 }));
            group.add(aura);
            
            group.position.set(x, y, z);
            group.userData = { id: id, sp: type, mass: mass, stress: stress, log: log, hum: hum + "%", temp: temp + "°C", lat: lat, lon: lon };
            scene.add(group);
            targets.push(group);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(targets, true);
            const hud = document.getElementById('live-hud');
            
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while(obj.parent && !obj.userData.id) obj = obj.parent;
                const data = obj.userData;
                if(data.id) {
                    hud.classList.add('active');
                    document.getElementById('target-id').innerText = data.id;
                    document.getElementById('target-type').innerText = data.sp;
                    document.getElementById('target-mass').innerText = data.mass;
                    document.getElementById('target-stress').innerText = data.stress;
                    document.getElementById('target-log').innerText = data.log;
                    document.getElementById('target-hum').innerText = data.hum;
                    document.getElementById('target-temp').innerText = data.temp;
                    document.getElementById('target-geo').innerText = `LAT: ${data.lat} | LON: ${data.lon}`;
                }
            } else hud.classList.remove('active');
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            dome.rotation.y += 0.0004;
            particles.rotation.y -= 0.00005;
            controls.update();
            
            targets.forEach(t => {
                if(t.children[0] instanceof THREE.Points) t.children[0].rotation.y += 0.01;
                t.children[1].scale.setScalar(1 + Math.sin(time * 3) * 0.1);
            });

            document.querySelectorAll('.neural-bar').forEach(b => {
                b.style.height = (10 + Math.random() * 90) + '%';
            });

            renderer.render(scene, camera);
        }

        function runLogs() {
            const msgs = ["Handshake QuDAG: VALID", "Pacote LoRa: RECEBIDO", "CSI Telemetry: SYNC", "Malha MESH: 100% HEALTH", "Diferencial de fase: OK", "PQC Cipher: AES-GCM"];
            setInterval(() => {
                const time = new Date().toLocaleTimeString('pt-BR', { hour12: false });
                const m = msgs[Math.floor(Math.random() * msgs.length)];
                const d = document.createElement('div');
                d.innerHTML = `<span style="color:#222">[${time}]</span> <span style="color:#00ff8c">${m}</span>`;
                document.getElementById('log-display').prepend(d);
                if(document.getElementById('log-display').children.length > 6) document.getElementById('log-display').lastChild.remove();
            }, 3000);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function generateSovereignPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');
            doc.setFillColor(0, 5, 5);
            doc.rect(0, 0, 297, 210, 'F');
            doc.setTextColor(0, 255, 140);
            doc.setFontSize(24);
            doc.text("SINALVERDE.IA | COMMAND REPORT v8.5", 20, 40);
            
            doc.setFontSize(12);
            doc.text("RELATÓRIO DE TELEMETRIA EM TEMPO REAL", 20, 60);
            
            // Dados simulados para o relatório
            const data = [
                ["IDENT", "TIPO", "COORDENADAS", "UMIDADE", "TEMP"],
                ["ID-SV-ANIM-132", "Onça", "-19.9221, -43.9451", "65%", "24.5°C"],
                ["ID-SV-ANIM-78", "Capivara", "-19.9235, -43.9460", "72%", "26.2°C"],
                ["ID-SV-HUM-001", "Humano", "-19.9210, -43.9440", "45%", "23.1°C"]
            ];

            let y = 80;
            data.forEach(row => {
                doc.text(row.join(" | "), 20, y);
                y += 10;
            });

            doc.save("SINALVERDE_SOVEREIGN_REPORT_REALTIME.pdf");
        }

        function unlockDashboard() {
            const loginScreen = document.getElementById('qr-login');
            loginScreen.style.opacity = '0';
            setTimeout(() => {
                loginScreen.style.display = 'none';
                init();
            }, 500);
        }

        // init(); // Removido do final para chamar apenas após login
    </script>
</body>
</html>
