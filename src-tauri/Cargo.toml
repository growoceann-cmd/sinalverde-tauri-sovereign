[package]
name = "sinalverde-tauri"
version = "1.0.0"
description = "SINALVERDE.IA Sovereign Desktop App"
authors = ["LETHUS SOVEREIGN SYSTEMS"]
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["shell-open"] }

[features]
# by default Tauri runs in production mode
# to enable development mode, pass --features dev
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
